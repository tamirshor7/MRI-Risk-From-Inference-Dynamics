[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-inference-risk"
version = "0.1.0"
description = "Reconstruction-risk prediction from MRI inference trajectories"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["mri_risk*"]
